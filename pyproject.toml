[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "matter-grouping"
version = "0.2.0"
description = "Group legal emails into matters with text embeddings and KMeans, then summarise each matter."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Faker>=40.46,<41",
    "numpy>=2.5,<3",
    "scikit-learn>=1.9,<2",
    "scipy>=1.18,<2",
]

[project.scripts]
matter-grouping = "matter_grouping.cli:main"

[project.optional-dependencies]
sbert = ["sentence-transformers>=6.2,<7"]
dev = ["pytest>=9.2,<10", "ruff>=0.17,<0.18"]

[tool.setuptools]
packages = ["matter_grouping"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
